name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        run: bash scripts/validate-plugin.sh

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh

  hook:
    name: Test hook script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash tests/test-capture-session.sh

  engine:
    name: Engine — typecheck, tests, reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev toolchain
        run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Unit, golden, determinism, conservation tests
        run: npm test
      - name: Rebuild bin/ and require zero diff
        run: |
          npm run build
          git diff --exit-code bin/ \
            || { echo "::error::bin/waybill.mjs does not match src/ — run npm run build and commit"; exit 1; }

  trigger-evals:
    name: Skill trigger evals (opt-in)
    runs-on: ubuntu-latest
    # Descriptions are the UI; these prove each skill fires on its canonical
    # phrases. Paid model calls, so the job runs only when the repository
    # variable RUN_TRIGGER_EVALS is 'true' AND on push (never on fork PRs,
    # where the ANTHROPIC_API_KEY secret is unavailable). Forks stay green.
    if: ${{ vars.RUN_TRIGGER_EVALS == 'true' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run trigger evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin marketplace add .
          claude plugin install waybill@waybill
          claude plugin eval waybill@waybill --threshold 0.8
