name: Release

# Declarative releases: .github/releases.txt lists `<tag> <sha>` lines,
# and this workflow reconciles the repository's tags + GitHub releases to
# that manifest whenever it changes on main (or on manual dispatch).
# Releasing = append a line, push main. Exists because some contribution
# environments can push branches but not tags and cannot dispatch
# workflows — a main push is the one channel that always works.
#
# Self-verifying, like the release gate: each entry is refused unless the
# tag's version matches package.json at that sha AND a CHANGELOG section
# for it exists at that sha (the section becomes the release body).
# Idempotent: existing tags are reused when they match (error when they
# don't — published tags never move); existing releases are untouched.
# The manifest's highest semver entry is marked "latest".

on:
  push:
    branches: [main]
    paths: ['.github/releases.txt', '.github/workflows/release.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reconcile:
    name: Reconcile tags + releases to the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          manifest='.github/releases.txt'
          [ -f "$manifest" ] || { echo "no $manifest — nothing to reconcile"; exit 0; }
          entries="$(grep -Ev '^\s*(#|$)' "$manifest" || true)"
          [ -n "$entries" ] || { echo "manifest is empty — nothing to reconcile"; exit 0; }
          maxtag="$(printf '%s\n' "$entries" | awk '{print $1}' | sort -V | tail -1)"
          fails=0
          drafts=0
          while read -r tag sha _; do
            echo "── $tag @ $sha"
            case "$tag" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::$tag: tags must look like vX.Y.Z"; fails=$((fails+1)); continue ;;
            esac
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "::error::$tag: sha $sha is not a commit in this repository"; fails=$((fails+1)); continue
            fi
            version="${tag#v}"
            git show "$sha:package.json" > /tmp/pkg.json
            pkg="$(node -p "require('/tmp/pkg.json').version")"
            if [ "$pkg" != "$version" ]; then
              echo "::error::$tag: package.json at $sha says $pkg — wrong sha or wrong tag"; fails=$((fails+1)); continue
            fi
            git show "$sha:CHANGELOG.md" > /tmp/changelog.md
            if ! grep -q "^## \[$version\]" /tmp/changelog.md; then
              echo "::error::$tag: no CHANGELOG section for $version at $sha"; fails=$((fails+1)); continue
            fi
            # gh api prints the error body to stdout on 404 — capture only on success.
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)" || existing=""
            if [ -n "$existing" ] && [ "$existing" != "$sha" ]; then
              echo "::error::$tag: already exists at $existing — published tags never move"; fails=$((fails+1)); continue
            fi
            # Drafts have no tag yet, so probe the releases list, not the tag.
            state="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name==\"$tag\") | if .draft then \"draft\" else \"published\" end" 2>/dev/null | head -1)" || state=""
            if [ "$state" = "published" ]; then
              echo "   release exists — untouched"
              continue
            fi
            if [ "$state" = "draft" ]; then
              echo "::warning::$tag: draft already staged — publish it from the Releases UI (publishing creates the tag under your identity)"
              drafts=$((drafts+1)); continue
            fi
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on=1; next }
              on && /^## \[/ { exit }
              on { print }
            ' /tmp/changelog.md > /tmp/body.md
            printf '\n[CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) · [VALIDATION](https://github.com/%s/blob/main/docs/VALIDATION.md) · [DECISIONS](https://github.com/%s/blob/main/docs/DECISIONS.md)\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" >> /tmp/body.md
            # One call creates the tag (at --target, when absent) AND the
            # release; guarded so one refusal never aborts the other
            # entries. Latest is pinned once, after the loop.
            target_flag=""
            [ -z "$existing" ] && target_flag="--target=$sha"
            if out="$(gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "waybill $version" \
              --notes-file /tmp/body.md \
              $target_flag 2>&1)"; then
              echo "   release published: $out"
            else
              # A 403 here is usually a protected-tag rule the Actions
              # token can't satisfy. Fall back to a DRAFT: drafts create
              # no tag, and publishing one from the UI creates the tag
              # under the publisher's (admin) identity, which bypasses
              # the protection. One click finishes it.
              echo "   direct publish refused ($out) — staging a draft"
              if out2="$(gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --title "waybill $version" \
                --notes-file /tmp/body.md \
                --target "$sha" 2>&1)"; then
                echo "::warning::$tag: staged as a DRAFT ($out2) — publish it from the Releases UI to create the tag"
                drafts=$((drafts+1))
              else
                echo "::error::$tag: release creation failed — $out — and draft fallback failed — $out2"
                fails=$((fails+1)); continue
              fi
            fi
          done <<EOF_ENTRIES
          $entries
          EOF_ENTRIES
          if gh release view "$maxtag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if out="$(gh release edit "$maxtag" --repo "$GITHUB_REPOSITORY" --latest 2>&1)"; then
              echo "latest pinned to $maxtag"
            else
              echo "::error::could not pin $maxtag as latest — $out"
              fails=$((fails+1))
            fi
          fi
          [ "$drafts" -gt 0 ] && echo "::warning::$drafts release(s) staged as drafts — publish them from the Releases UI to finish"
          exit "$fails"
