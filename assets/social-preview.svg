  <text x="64" y="86" font-size="42" font-weight="700" fill="#161514">waybill</text>
  <text x="64" y="120" font-size="20" fill="#6B655A">token accounting</text>
  <text x="64" y="146" font-size="20" fill="#6B655A">for AI-assisted work</text>
  <text x="64" y="196" font-size="19" fill="#161514">ITEMS</text>
  <text x="64" y="228" font-size="16" fill="#3A362F">metering      deterministic</text>
  <text x="64" y="254" font-size="16" fill="#3A362F">attribution   per story, conf. shown</text>
  <text x="64" y="280" font-size="16" fill="#3A362F">verification  offline, recipient-run</text>
  <text x="64" y="332" font-size="19" fill="#161514">SUBTOTAL</text>
  <rect x="58" y="346" width="248" height="30" fill="#F0C674"/>
  <text x="64" y="368" font-size="17" font-weight="700" fill="#161514">unattributed: shown</text>
  <text x="64" y="430" font-size="14" fill="#6B655A">EVIDENCE TIER: FACTS</text>
  <text x="64" y="454" font-size="14" fill="#6B655A">RANGES NOT MIDPOINTS</text>
  <text x="64" y="478" font-size="14" fill="#6B655A">NOTHING PADDED</text>
  <text x="64" y="556" font-size="16" fill="#161514">github.com/Jakeintech/waybill</text>
  <text x="64" y="582" font-size="14" fill="#6B655A">MIT · local-first · no telemetry</text>
  <g transform="translate(490, 104) scale(0.9)">
    <svg width="800" height="484" viewBox="0 0 800 484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- waybill demo: sync → standup → token pitch → verify. Pure SVG/CSS,
       no scripts, no external requests; demo data. 36s loop.
       Base opacity is 1 (E-03): wherever CSS animation doesn't run
       (Firefox <img>, previews, thumbnails), the full static transcript
       renders. Animated playback cold-opens on the payoff frame (the
       token-pitch numbers, visible from 0s), clears into the story, and
       holds the finished transcript instead of fading to nothing — the
       payoff groups stay lit across the loop boundary. -->
  <style>
    .l { fill: #E6E8EF; }
    .p { fill: #7ED8A0; font-weight: 600; }
    .u { fill: #7B89E4; font-weight: 600; }
    .d { fill: #8A93A6; }
    .a { fill: #F0C674; }
    .g { opacity: 1;  }
    .g1  { animation-name: k1; }  @keyframes k1  { 0%,11% { opacity:0 } 13% { opacity:1 } 100% { opacity:1 } }
    .g2  { animation-name: k2;  } @keyframes k2  { 0%,16% { opacity:0 } 18% { opacity:1 } 100% { opacity:1 } }
    .g3  { animation-name: k3;  } @keyframes k3  { 0%,22% { opacity:0 } 24% { opacity:1 } 100% { opacity:1 } }
    .g4  { animation-name: k4;  } @keyframes k4  { 0%,26% { opacity:0 } 28% { opacity:1 } 100% { opacity:1 } }
    .g5  { animation-name: k5;  } @keyframes k5  { 0%,33% { opacity:0 } 35% { opacity:1 } 100% { opacity:1 } }
    .g6  { animation-name: k6;  } @keyframes k6  { 0%,40% { opacity:0 } 42% { opacity:1 } 100% { opacity:1 } }
    .g7  { animation-name: k7;  } @keyframes k7  { 0%,44% { opacity:0 } 46% { opacity:1 } 100% { opacity:1 } }
    .g8  { animation-name: k8;  } @keyframes k8  { 0% { opacity:1 } 8% { opacity:1 } 10%,55% { opacity:0 } 57% { opacity:1 } 100% { opacity:1 } }
    .g9  { animation-name: k9;  } @keyframes k9  { 0% { opacity:1 } 8% { opacity:1 } 10%,60% { opacity:0 } 62% { opacity:1 } 100% { opacity:1 } }
    .g10 { animation-name: k10; } @keyframes k10 { 0%,70% { opacity:0 } 72% { opacity:1 } 100% { opacity:1 } }
    .g11 { animation-name: k11; } @keyframes k11 { 0%,74% { opacity:0 } 76% { opacity:1 } 100% { opacity:1 } }
    .g12 { animation-name: k12; } @keyframes k12 { 0%,84% { opacity:0 } 86% { opacity:1 } 100% { opacity:1 } }
  </style>

