<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- waybill demo: sync → standup → token pitch → verify. Pure SVG/CSS,
       no scripts, no external requests; demo data. 36s loop. -->
  <style>
    .l { fill: #E6E8EF; }
    .p { fill: #7ED8A0; font-weight: 600; }
    .u { fill: #7B89E4; font-weight: 600; }
    .d { fill: #8A93A6; }
    .a { fill: #F0C674; }
    .g { opacity: 0; animation: 36s linear infinite; }
    .g1  { animation-name: k1; }  @keyframes k1  { 0%,2%  { opacity:0 } 4%  { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g2  { animation-name: k2;  } @keyframes k2  { 0%,8%  { opacity:0 } 10% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g3  { animation-name: k3;  } @keyframes k3  { 0%,17% { opacity:0 } 19% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g4  { animation-name: k4;  } @keyframes k4  { 0%,23% { opacity:0 } 25% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g5  { animation-name: k5;  } @keyframes k5  { 0%,32% { opacity:0 } 34% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g6  { animation-name: k6;  } @keyframes k6  { 0%,40% { opacity:0 } 42% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g7  { animation-name: k7;  } @keyframes k7  { 0%,46% { opacity:0 } 48% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g8  { animation-name: k8;  } @keyframes k8  { 0%,58% { opacity:0 } 60% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g9  { animation-name: k9;  } @keyframes k9  { 0%,64% { opacity:0 } 66% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g10 { animation-name: k10; } @keyframes k10 { 0%,78% { opacity:0 } 80% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g11 { animation-name: k11; } @keyframes k11 { 0%,83% { opacity:0 } 85% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
    .g12 { animation-name: k12; } @keyframes k12 { 0%,89% { opacity:0 } 91% { opacity:1 } 97% { opacity:1 } 100% { opacity:0 } }
  </style>

  <rect width="800" height="484" rx="10" fill="#1B2129"/>
  <rect width="800" height="34" rx="10" fill="#232A35"/>
  <rect y="24" width="800" height="10" fill="#232A35"/>
  <circle cx="22" cy="17" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="17" r="5.5" fill="#FEBC2E"/>
  <circle cx="62" cy="17" r="5.5" fill="#28C840"/>
  <text x="400" y="21" text-anchor="middle" class="d" font-size="12">waybill — token accounting for AI-assisted work (demo data)</text>

  <g class="g g1">
    <text x="24" y="62" class="p">❯ claude</text>
    <text x="24" y="82"><tspan class="d">&gt; </tspan><tspan class="u">initialize my waybill ledger</tspan></text>
  </g>
  <g class="g g2">
    <text x="24" y="102" class="l">Initialized ~/.waybill (git repo, append-only streams)</text>
    <text x="24" y="120" class="l">Pricing: 10 bundled Anthropic models imported — costs appear from day one</text>
  </g>

  <g class="g g3">
    <text x="24" y="146"><tspan class="d">&gt; </tspan><tspan class="u">sync my ledger</tspan></text>
  </g>
  <g class="g g4">
    <text x="24" y="166" class="l">12 shipped items reconciled from Jira + merged PRs · baseline derived</text>
    <text x="24" y="184" class="d">(escrow-sealed estimates carried forward; 2 orphans surfaced, not hidden)</text>
  </g>

  <g class="g g5">
    <text x="24" y="212" class="d">… a sprint of normal work; the SessionEnd miner meters every token,</text>
    <text x="24" y="230" class="d">    deterministically, offline — no model calls, no network …</text>
  </g>

  <g class="g g6">
    <text x="24" y="258"><tspan class="d">&gt; </tspan><tspan class="u">what did I do yesterday</tspan></text>
  </g>
  <g class="g g7">
    <text x="24" y="278" class="l">• Shipped: PLAT-482 — Retry logic for checkout webhook (5 pts, PR #1932)</text>
    <text x="24" y="296" class="l">• In progress: DATA-77 — Ingest dedupe (3 sessions)</text>
    <text x="24" y="314" class="d">7 sessions · 41 turns · 3.2M tokens</text>
  </g>

  <g class="g g8">
    <text x="24" y="342"><tspan class="d">&gt; </tspan><tspan class="u">build my token pitch</tspan></text>
  </g>
  <g class="g g9">
    <text x="24" y="362" class="l">Since the July grant: 34 points shipped, 11 PRs merged &amp; deployed,</text>
    <text x="24" y="380" class="l">31–58 hours saved (pre-registered basis), at 0.9M tokens per point.</text>
    <text x="24" y="398" class="a">62% of grant spent · 8% unattributed — shown, never hidden</text>
  </g>

  <g class="g g10">
    <text x="24" y="426" class="p">❯ waybill verify</text>
  </g>
  <g class="g g11">
    <text x="24" y="446" class="l">All checks passed. Every escrow seal recomputes; every token is accounted for.</text>
  </g>
  <g class="g g12">
    <text x="24" y="470" class="u">waybill — bring receipts.</text>
    <text x="776" y="470" text-anchor="end" class="d" font-size="11">the recipient can re-run this: export --pack</text>
  </g>
</svg>
